<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>BMI Calculator</h1>
    <p>Calculate your Body Mass Index in seconds</p>

    <form method="POST">
        <label>Weight (kg)</label>
        <input type="number" step="0.1" name="weight" placeholder="e.g. 70"
               value="{{ weight if weight else '' }}" required>

        <label>Height (cm)</label>
        <input type="number" step="0.1" name="height" placeholder="e.g. 175"
               value="{{ height if height else '' }}" required>

        <button type="submit">Calculate BMI</button>
    </form>

    {% if bmi %}
    <div class="result">
        <h2>Your BMI: {{ bmi }}</h2>
        <p>
    <span style="color: black; font-weight: 700;">Category:</span>
    <span class="category">{{ category }}</span>
        </p>


    </div>
    {% endif %}
</div>

</body>
</html>
